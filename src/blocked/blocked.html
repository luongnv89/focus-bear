<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusBear - Limit Reached</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <div class="container">
      <div class="bear">🐻</div>
      <h1>Whoa there, friend!</h1>
      <p class="message">
        You've hit your daily limit for <strong id="domain-name">this site</strong>.
      </p>
      <p class="subtext">Maybe it's time for a breather? Your focus bear thinks so.</p>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-label">Visits today:</span>
          <span class="stat-value" id="visit-count">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Limit:</span>
          <span class="stat-value" id="limit-value">--</span>
        </div>
      </div>

      <div class="actions">
        <button id="back-btn" class="btn btn-primary">Back to work</button>
        <button id="settings-btn" class="btn btn-secondary">Adjust limits</button>
      </div>

      <p class="footer">Reset happens at midnight. You got this! 💪</p>
    </div>

    <script src="blocked.js"></script>
  </body>
</html>

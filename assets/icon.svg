<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Light mode version: dark panda on light background -->

  <!-- Background circle (white/light) -->
  <circle cx="64" cy="64" r="64" fill="#FFFFFF"/>

  <!-- Left ear (black) -->
  <circle cx="42" cy="38" r="16" fill="#2C3E50"/>

  <!-- Right ear (black) -->
  <circle cx="86" cy="38" r="16" fill="#2C3E50"/>

  <!-- Head (white) -->
  <circle cx="64" cy="68" r="36" fill="#FFFFFF"/>

  <!-- Left eye patch (black) -->
  <ellipse cx="50" cy="64" rx="10" ry="14" fill="#2C3E50"/>

  <!-- Right eye patch (black) -->
  <ellipse cx="78" cy="64" rx="10" ry="14" fill="#2C3E50"/>

  <!-- Left eye (white) -->
  <circle cx="50" cy="64" r="4" fill="#FFFFFF"/>

  <!-- Right eye (white) -->
  <circle cx="78" cy="64" r="4" fill="#FFFFFF"/>

  <!-- Nose (black) -->
  <ellipse cx="64" cy="80" rx="6" ry="5" fill="#2C3E50"/>

  <!-- Smile (black) -->
  <path d="M 54 86 Q 64 92 74 86" stroke="#2C3E50" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Subtle border for contrast on light backgrounds -->
  <circle cx="64" cy="64" r="63" fill="none" stroke="#E0E0E0" stroke-width="1"/>
</svg>

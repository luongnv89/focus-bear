<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusBear - Limit Reached</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="container" role="main">
      <div class="bear" role="img" aria-label="Bear mascot">🐻</div>
      <h1 id="page-heading">Whoa there, friend!</h1>
      <p class="message" role="status" aria-live="polite">
        You've hit your <strong id="limit-type">daily</strong> limit for <strong id="domain-name">this site</strong>.
      </p>
      <p class="subtext" id="subtext">Maybe it's time for a breather? Your focus bear thinks so.</p>

      <div class="stats" role="region" aria-label="Visit statistics">
        <div class="stat-item">
          <span class="stat-label">Visits today:</span>
          <span class="stat-value" id="visit-count" aria-label="Visit count">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Limit:</span>
          <span class="stat-value" id="limit-value" aria-label="Limit value">--</span>
        </div>
      </div>

      <div class="actions">
        <button id="back-btn" class="btn btn-primary" aria-label="Go back to previous page">
          Back to work
        </button>
        <button id="settings-btn" class="btn btn-secondary" aria-label="Open settings to adjust limits">
          Adjust limits
        </button>
      </div>

      <p class="footer">Reset happens at midnight. You got this! 💪</p>
    </main>

    <script src="blocked.js"></script>
  </body>
</html>

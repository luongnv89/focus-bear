name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint-and-test:
    name: Lint, Format, Test & Build
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Upload build artifacts
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: dist/
          retention-days: 7

  landing:
    name: Landing — Lint, Format & Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: landing-page
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install landing dependencies
        run: npm ci

      - name: Run ESLint (landing)
        run: npm run lint -- --max-warnings 0

      - name: Check formatting (landing)
        run: npm run format:check

      - name: Build landing page
        run: npm run build

  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      # Fail loudly if the coverage report is missing or malformed, or if
      # coverage drops below the M3 target (60% lines). The threshold is
      # intentionally set below the #48 recorded rate (~64.5%) so the gate
      # catches silent regressions without immediately failing.
      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true

      - name: Enforce line coverage threshold (>=60%)
        if: always()
        run: |
          set -euo pipefail
          THRESHOLD=60
          LCOV=./coverage/lcov.info
          if [ ! -f "$LCOV" ]; then
            echo "::error::Coverage report $LCOV not found — failing the build."
            exit 1
          fi
          # Aggregate lcov LF (lines found) and LH (lines hit) across all records.
          read -r LH LF < <(awk -F: '
            /^LF:/ { lf += $2 }
            /^LH:/ { lh += $2 }
            END { printf "%d %d\n", (lh ? lh : 0), (lf ? lf : 0) }
          ' "$LCOV")
          if [ "${LF}" -le 0 ]; then
            echo "::error::No executable lines found in $LCOV — failing the build."
            exit 1
          fi
          PCT=$(awk -v h="$LH" -v f="$LF" 'BEGIN { printf "%.4f", (h * 100.0) / f }')
          echo "::notice::Line coverage: ${PCT}% (${LH}/${LF}, threshold ${THRESHOLD}%)"
          if awk -v p="$PCT" -v t="$THRESHOLD" 'BEGIN { exit !(p + 0 >= t + 0) }'; then
            echo "::notice::Coverage gate passed."
          else
            echo "::error::Line coverage ${PCT}% is below the ${THRESHOLD}% threshold."
            exit 1
          fi

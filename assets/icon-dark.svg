<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dark mode version: light paw print on dark background -->

  <!-- Background circle (dark) -->
  <circle cx="64" cy="64" r="64" fill="#1a1a1a"/>

  <!-- Paw toe pads -->
  <ellipse cx="52" cy="58" rx="11" ry="13" fill="#F5F5F5"/>
  <ellipse cx="76" cy="58" rx="11" ry="13" fill="#F5F5F5"/>
  <ellipse cx="40" cy="76" rx="10.5" ry="13" fill="#F5F5F5"/>
  <ellipse cx="88" cy="76" rx="10.5" ry="13" fill="#F5F5F5"/>

  <!-- Main paw pad -->
  <path d="M 64 79
           C 78 79 88 86 88 96
           C 88 106 77 112 64 112
           C 51 112 40 106 40 96
           C 40 86 50 79 64 79 Z"
        fill="#F5F5F5"/>

  <!-- Focus highlight in the main pad -->
  <circle cx="64" cy="98" r="5" fill="#1BFF6E"/>

  <!-- Subtle border for contrast on dark backgrounds -->
  <circle cx="64" cy="64" r="63" fill="none" stroke="#333333" stroke-width="1"/>
</svg>